[project]
name = "x4"
version = "0.1.0"
description = "Mac-side companion for the x4r firmware"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1",
  "pyserial>=3.5",
  "pydantic>=2.8",
  "mcp>=1.2",
  "esptool>=5.0",
  "pillow>=11.0",
  "pymupdf>=1.25",
  "ebooklib>=0.18",
  "trafilatura>=2.0",
  "feedparser>=6.0",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "fonttools>=4.62",
  "freetype-py>=2.5",
  "zopfli>=0.2",
  "markdown-it-py>=3.0",
  "zstandard>=0.23",
]

[project.scripts]
x4 = "x4.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/x4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
